      - remote_transmitter.transmit_raw:
          code: [264, -734, 242, -741, 736, -268, 228, -757, 242, -742, 266, -720, 266, -723, 739, -266, 744, -236, 733, -265, 253, -739, 716, -294, 226, -759, 241, -741, 247, -737, 735, -268, 720, -267, 266, -722, 237, -755, 240, -758, 242, -739, 242, -742, 736, -261, 238, -755, 244, -755, 741, -264, 721, -268, 229, -758, 739, -262, 238, -756, 243, -727, 740, -262, 238]
          repeat: { times: 8, wait_time: 8ms }

  - id: tx_v2
