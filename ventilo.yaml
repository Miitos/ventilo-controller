button:
  - platform: template
    name: "Power"
    on_press:
      - script.execute: tx_power
      - script.execute:
          id: apply_cmd
          cmd: 0

  - platform: template
    name: "Vitesse 1"
    on_press:
      - script.execute: tx_v1
      - script.execute:
          id: apply_cmd
          cmd: 1

  - platform: template
    name: "Vitesse 2"
    on_press:
      - script.execute: tx_v2
      - script.execute:
          id: apply_cmd
          cmd: 2

  - platform: template
    name: "Vitesse 3"
    on_press:
      - script.execute: tx_v3
      - script.execute:
          id: apply_cmd
          cmd: 3

  - platform: template
    name: "Vitesse 4"
    on_press:
      - script.execute: tx_v4
      - script.execute:
          id: apply_cmd
          cmd: 4

  - platform: template
    name: "Vitesse 5"
    on_press:
      - script.execute: tx_v5
      - script.execute:
          id: apply_cmd
          cmd: 5

  - platform: template
