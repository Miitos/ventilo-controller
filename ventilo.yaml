esphome:
  name: ventilo

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK

globals:
  - id: last_tx_ms
    type: uint32_t
    initial_value: '0'
  - id: last_rx_code
    type: uint32_t
    initial_value: '0'
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'

remote_receiver:
  pin: GPIO13
  dump: raw
  tolerance: 40%
  filter: 100us
  idle: 5ms
  # Détection de la télécommande physique : décode la trame, la compare aux
  # signatures connues et met à jour l'état (synchro d'état).
  on_raw:
    then:
      - lambda: |-
          // Nos propres émissions ne doivent pas être prises pour la télécommande
          if (millis() - id(last_tx_ms) < 500) return;

          // Codage PWM : impulsion longue (~740 µs) = 1, courte (~250 µs) = 0
          std::vector<bool> bits;
          for (auto v : x) {
            if (v > 0) bits.push_back(v > 500);
          }
          if (bits.size() < 32) return;

          // Ordre = paramètre cmd de apply_cmd : 0 Power, 1-6 vitesses, 7 lumière, 8 couleur, 9 sens
          static const uint32_t CODES[] = {
            0x21D18508, 0x21D18269, 0x21D18850, 0x21D1866D, 0x21D18379,
            0x21D18481, 0x21D18ABC, 0x21D18962, 0x21D18E56, 0x21D188FA,
          };
          // Trame : adresse (20 bits) | touche (5 bits) | compteur (3 bits) | contrôle (4 bits).
          // Le compteur avance à chaque appui : on compare la touche, et le contrôle
          // via (contrôle XOR quartet précédent), qui ne dépend que de la touche.
          auto key = [](uint32_t c) { return c & 0xFFFFFF80; };
          auto check = [](uint32_t c) { return (c ^ (c >> 4)) & 0xF; };
          // Fenêtre glissante : tolère l'impulsion d'en-tête de la première répétition
          for (size_t off = 0; off + 32 <= bits.size(); off++) {
            uint32_t code = 0;
            for (size_t i = 0; i < 32; i++) code = (code << 1) | (bits[off + i] ? 1 : 0);
            for (int cmd = 0; cmd < 10; cmd++) {
              if (key(code) != key(CODES[cmd]) || check(code) != check(CODES[cmd])) continue;
              // La télécommande répète la même trame (même compteur) tant que le bouton
              // est tenu : un seul appui. Un nouvel appui change le compteur.
              uint32_t now = millis();
              bool repeat = code == id(last_rx_code) && now - id(last_rx_ms) < 400;
              id(last_rx_ms) = now;
              if (repeat) return;
              id(last_rx_code) = code;
              ESP_LOGI("sync", "Télécommande : commande %d (0x%08X)", cmd, code);
              id(apply_cmd).execute(cmd);
              return;
            }
          }

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - lambda: id(last_tx_ms) = millis();
      - cc1101.begin_rx

# État du ventilateur, tenu par le firmware (télécommande physique + API).
# Modifiable via l'API pour corriger une dérive : rien n'est émis.
switch:
  - platform: template
    id: etat_marche
    name: "Etat marche"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: etat_lumiere
    name: "Etat lumiere"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: etat_sens
    name: "Etat sens inverse"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    id: etat_vitesse
    name: "Etat vitesse"
    optimistic: true
    min_value: 1
    max_value: 6
    step: 1
    initial_value: 3
    restore_value: true
  - platform: template
    id: etat_couleur
    name: "Etat couleur"
    optimistic: true
    min_value: 0
    max_value: 2
    step: 1
    initial_value: 0
    restore_value: true

script:
  - id: apply_cmd
    mode: queued
    parameters:
      cmd: int
    then:
      - lambda: |-
          if (cmd == 0) {
            id(etat_marche).publish_state(!id(etat_marche).state);
          } else if (cmd >= 1 && cmd <= 6) {
            id(etat_marche).publish_state(true);
            auto call = id(etat_vitesse).make_call();
            call.set_value(cmd);
            call.perform();
          } else if (cmd == 7) {
            id(etat_lumiere).publish_state(!id(etat_lumiere).state);
          } else if (cmd == 8) {
            auto call = id(etat_couleur).make_call();
            call.set_value(((int) id(etat_couleur).state + 1) % 3);
            call.perform();
          } else if (cmd == 9) {
            id(etat_sens).publish_state(!id(etat_sens).state);
          }

  - id: tx_power
    then:
      - remote_transmitter.transmit_raw:
          code: [264, -720, 245, -743, 737, -268, 229, -755, 242, -742, 265, -720, 266, -724, 738, -261, 736, -263, 722, -262, 238, -757, 715, -291, 226, -742, 265, -720, 266, -722, 735, -267, 744, -243, 266, -724, 262, -734, 263, -723, 265, -724, 750, -243, 262, -725, 726, -276, 264, -744, 246, -738, 242, -753, 241, -751, 740, -239, 263, -741, 244, -754, 242, -751, 243]
          repeat: { times: 8, wait_time: 8ms }

  - id: tx_v1
